<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form</title>
</head>

<body>
  <form onsubmit="displayFormContents(); return false;">
    <label for="firstname">Firstname:</label>
    <input type="text" id="firstname" required /><br />
    <label for="name">Name:</label>
    <input type="text" id="name" required /><br />
    <label for="age">Age:</label>
    <input type="number" id="age" required /><br />
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" required /><br />
    <label for="email">Email:</label>
    <input type="email" id="email" required /><br />
    <label for="student">Student at 42 ?:</label>
    <input type="checkbox" id="student" /><br />
    <label for="gender_male">Male</label>
    <input type="radio" id="gender_male" name="gender" value="male" required />
    <label for="gender_female">Female</label>
    <input type="radio" id="gender_female" name="gender" value="female" />
    <label for="gender_other">Other</label>
    <input type="radio" id="gender_other" name="gender" value="other" /><br />
    <input type="submit" value="Submit" />
  </form>
  <script src="popup.js"></script>
</body>

</html>
